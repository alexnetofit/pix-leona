<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Leona</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    :root {
      --bg: #0c0a12;
      --surface: #171322;
      --border: #342b49;
      --text: #f2eef8;
      --muted: #a99dbd;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(660px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 60px; }
    header { text-align: center; margin-bottom: 20px; }
    img { height: 50px; }
    h1 { font-size: 22px; margin: 8px 0 3px; }
    p { margin: 0; color: var(--muted); font-size: 13px; }
    .shell {
      min-height: 590px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      overflow: hidden;
      padding: 8px;
    }
    .checkout-container { min-height: 560px; }
    #status { text-align: center; padding: 80px 20px; color: var(--muted); }
    #error { color: var(--danger); white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="/logo-leona.png" alt="Leona">
      <h1>Pagamento seguro</h1>
      <p>Processado pela Paddle</p>
    </header>
    <section class="shell">
      <div id="status">Preparando checkout…</div>
      <div id="error"></div>
      <div class="checkout-container"></div>
    </section>
  </main>

  <script>
    async function loadCheckout() {
      const token = new URLSearchParams(location.search).get('token');
      if (!token) throw new Error('Link de checkout inválido ou incompleto.');
      const response = await fetch(
        `/api/paddle-checkout-session?token=${encodeURIComponent(token)}`,
        { credentials: 'same-origin' }
      );
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || data.error || 'Não foi possível abrir o checkout.');
      return data;
    }

    (async () => {
      try {
        if (!window.Paddle) throw new Error('Paddle.js não carregou.');
        const checkout = await loadCheckout();
        if (checkout.environment === 'sandbox') Paddle.Environment.set('sandbox');
        Paddle.Initialize({ token: checkout.client_token });
        document.getElementById('status').style.display = 'none';
        Paddle.Checkout.open({
          transactionId: checkout.transaction_id,
          customer: { id: checkout.customer_id },
          settings: {
            displayMode: 'inline',
            theme: 'dark',
            locale: 'pt-BR',
            frameTarget: 'checkout-container',
            frameInitialHeight: 560,
            frameStyle: 'width:100%;min-height:560px;border:0;background:transparent;',
            successUrl: checkout.success_url || '/paddle?checkout=success',
            showAddDiscounts: false,
            allowLogout: false,
            ...(checkout.payment_method === 'pix'
              ? { allowedPaymentMethods: ['pix'] }
              : {})
          }
        });
      } catch (error) {
        document.getElementById('status').style.display = 'none';
        document.getElementById('error').textContent = error.message || String(error);
      }
    })();
  </script>
</body>
</html>
