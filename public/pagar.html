<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagar — Leona Flow</title>
    <link rel="icon" type="image/png" href="/logo-leona.png">
    <style>
        :root {
            --bg-primary: #0c0a12;
            --bg-secondary: #151120;
            --bg-card: #1e1830;
            --bg-elevated: #261f3a;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-soft: rgba(139, 92, 246, 0.12);
            --text-primary: #f0ecf7;
            --text-secondary: #9589ad;
            --text-muted: #6b5f82;
            --error: #ef4444;
            --success: #10b981;
            --border: #2a2240;
            --border-light: #352d50;
            --glow-purple: rgba(139, 92, 246, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
            color: var(--text-primary);
            background: var(--bg-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0 auto auto 0;
            width: 100%;
            height: 400px;
            background: radial-gradient(ellipse at 50% -20%, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
        .wrap {
            width: min(480px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 56px;
            position: relative;
            z-index: 1;
        }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand img {
            height: 56px;
            width: auto;
            filter: drop-shadow(0 4px 20px var(--glow-purple));
        }
        .brand p {
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        .product {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 18px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .product img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-elevated);
        }
        .product h1 {
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .product span { color: var(--text-secondary); font-size: 0.8rem; }
        .price {
            margin-left: auto;
            text-align: right;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--accent);
            white-space: nowrap;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 14px 0 6px;
        }
        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 14px;
            font: inherit;
            color: var(--text-primary);
            background: var(--bg-card);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input::placeholder { color: var(--text-muted); }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow-purple);
        }
        input[readonly] { color: var(--text-secondary); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 20px 0 4px;
        }
        .methods button {
            border: 1px solid var(--border);
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px 10px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
        }
        .methods button.active {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--accent-soft);
        }
        .pay {
            width: 100%;
            margin-top: 18px;
            border: 0;
            border-radius: 12px;
            padding: 14px 16px;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            box-shadow: 0 2px 12px var(--glow-purple);
        }
        .pay:hover { background: linear-gradient(135deg, var(--accent-hover), var(--accent)); }
        .pay:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
        .err {
            display: none;
            margin-top: 12px;
            background: rgba(239, 68, 68, 0.12);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.86rem;
        }
        .pix-box, .ok-box { display: none; text-align: center; }
        .pix-box h2, .ok-box h2 { font-size: 1.05rem; margin-bottom: 6px; }
        .ok-box h2 { color: var(--success); }
        .pix-box img {
            width: 220px;
            height: 220px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: #fff;
            margin: 12px 0 14px;
        }
        .copy {
            width: 100%;
            border: 1px dashed var(--border-light);
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.78rem;
            word-break: break-all;
            cursor: pointer;
            color: var(--text-secondary);
        }
        #card-element {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            min-height: 48px;
            background: var(--bg-card);
        }
        .hint { color: var(--text-muted); font-size: 0.78rem; margin-top: 12px; text-align: center; }
        a { color: var(--accent); }
        @media (max-width: 520px) {
            .brand img { height: 44px; }
            .card { padding: 20px 16px; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <img src="/logo-leona.png" alt="Leona">
            <p>Pagamento seguro</p>
        </div>

        <div class="card" id="formCard">
            <div class="product">
                <img src="/leona-finance-192.png" alt="">
                <div>
                    <h1 id="offerName">Leona Flow</h1>
                    <span id="offerQty">1 conexão · mensal</span>
                </div>
                <div class="price" id="offerPrice">—</div>
            </div>

            <label>E-mail</label>
            <input id="email" type="email" autocomplete="email" readonly>

            <label>Nome completo</label>
            <input id="name" type="text" autocomplete="name" placeholder="Como no documento">

            <div class="row">
                <div>
                    <label>CPF / CNPJ</label>
                    <input id="document" type="text" inputmode="numeric" placeholder="000.000.000-00">
                </div>
                <div>
                    <label>Celular</label>
                    <input id="phone" type="tel" placeholder="(12) 99999-9999">
                </div>
            </div>

            <div class="methods">
                <button type="button" id="tabPix" class="active" onclick="setMethod('pix')">PIX</button>
                <button type="button" id="tabCard" onclick="setMethod('card')">Cartão</button>
            </div>

            <div id="cardFields" style="display:none;">
                <label>Cartão</label>
                <div id="card-element"></div>
            </div>

            <button class="pay" id="payBtn" type="button" onclick="submitPay()">Assinar com PIX</button>
            <div class="err" id="err"></div>
            <p class="hint" id="payHint">PIX automático ou cartão recorrente. A cobrança se repete todo mês.</p>
        </div>

        <div class="card pix-box" id="pixCard">
            <h2>Pague com PIX</h2>
            <p class="hint" style="margin-bottom:8px;">Escaneie o QR ou toque no código para copiar.</p>
            <img id="pixQr" alt="QR Code PIX">
            <div class="copy" id="pixCopy" onclick="copyPix()"></div>
            <p class="hint" id="pixWait">Aguardando pagamento...</p>
        </div>

        <div class="card ok-box" id="okCard">
            <h2>Pagamento confirmado</h2>
            <p>Sua Leona já está sendo liberada.</p>
            <p class="hint" style="margin-top:16px;"><a id="backLink" href="/assinatura">Voltar para a assinatura</a></p>
        </div>
    </div>

    <script src="https://js.pagou.ai/payments/v3.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const state = {
            accountId: params.get('account_id') || '',
            email: params.get('email') || '',
            qty: Math.max(1, Number(params.get('qty')) || 1),
            amount: Number(params.get('amount')) || 0,
            offer: params.get('offer') || '',
            kind: ['one_shot', 'oneshot', 'avulso', 'upgrade'].includes(String(params.get('kind') || '').toLowerCase())
                ? 'one_shot'
                : 'subscription',
            method: 'pix',
            elements: null,
            card: null,
            cardValid: false,
            txId: null,
            subId: null,
            pixCode: ''
        };

        function money(n) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n);
        }
        function showErr(msg) {
            const el = document.getElementById('err');
            el.textContent = msg || '';
            el.style.display = msg ? 'block' : 'none';
        }
        function digits(v) { return String(v || '').replace(/\D/g, ''); }
        function payLabel() {
            if (state.method === 'pix') return state.kind === 'one_shot' ? 'Gerar PIX' : 'Assinar com PIX';
            return state.kind === 'one_shot' ? 'Pagar no cartão' : 'Assinar no cartão';
        }

        document.getElementById('email').value = state.email;
        document.getElementById('offerName').textContent = state.offer || `Leona Flow — ${state.qty} conex${state.qty === 1 ? 'ão' : 'ões'}`;
        document.getElementById('offerQty').textContent = state.kind === 'one_shot'
            ? `${state.qty} conex${state.qty === 1 ? 'ão' : 'ões'} · ajuste avulso`
            : `${state.qty} conex${state.qty === 1 ? 'ão' : 'ões'} · assinatura mensal`;
        document.getElementById('offerPrice').textContent = state.amount ? money(state.amount) : '—';
        document.getElementById('payHint').textContent = state.kind === 'one_shot'
            ? 'Pagamento único do upgrade no ciclo atual. Não cria nova recorrência.'
            : 'PIX automático ou cartão recorrente. A cobrança se repete todo mês.';
        document.getElementById('payBtn').textContent = payLabel();
        document.getElementById('backLink').href = `/assinatura?account_id=${encodeURIComponent(state.accountId)}&email=${encodeURIComponent(state.email)}`;

        async function setMethod(method) {
            state.method = method;
            document.getElementById('tabPix').classList.toggle('active', method === 'pix');
            document.getElementById('tabCard').classList.toggle('active', method === 'card');
            document.getElementById('cardFields').style.display = method === 'card' ? 'block' : 'none';
            document.getElementById('payBtn').textContent = payLabel();
            if (method === 'card') await ensureCard();
        }

        async function ensureCard() {
            if (state.card || !window.Pagou) return;
            const cfg = await fetch('/api/pagou-config').then((r) => r.json());
            if (!cfg.public_key) {
                showErr('Cartão indisponível no momento. Use PIX.');
                setMethod('pix');
                return;
            }
            state.elements = Pagou.elements({
                publicKey: cfg.public_key,
                locale: 'pt-BR',
                origin: location.origin
            });
            state.card = state.elements.create('card', {
                theme: 'night',
                style: {
                    base: {
                        color: '#f0ecf7',
                        fontFamily: 'Inter, system-ui, sans-serif',
                        fontSize: '16px',
                        borderRadius: '8px',
                        backgroundColor: '#1e1830'
                    },
                    focus: { borderColor: '#8b5cf6' },
                    invalid: { color: '#ef4444' }
                }
            });
            state.card.mount('#card-element');
            state.card.on('change', ({ valid }) => { state.cardValid = !!valid; });
        }

        function buyer() {
            return {
                name: document.getElementById('name').value.trim(),
                document: digits(document.getElementById('document').value),
                phone: digits(document.getElementById('phone').value)
            };
        }

        async function createTx(extra = {}) {
            const r = await fetch('/api/pagou-pay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    account_id: state.accountId,
                    email: state.email,
                    qty: state.qty,
                    amount: state.amount,
                    offer_name: state.offer,
                    kind: state.kind,
                    buyer: buyer(),
                    ...extra
                })
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || 'Falha ao gerar o pagamento');
            return data;
        }

        async function submitPay() {
            const btn = document.getElementById('payBtn');
            showErr('');
            if (!state.accountId || !state.email) {
                showErr('Abra esta página pelo painel da Leona.');
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Processando...';
            try {
                if (state.method === 'pix') {
                    const data = await createTx({ method: 'pix' });
                    showPix(data);
                    return;
                }
                if (!state.elements || !state.cardValid) {
                    throw new Error('Preencha os dados do cartão');
                }
                const result = await state.elements.submit({
                    mode: state.kind === 'subscription' ? 'subscription' : 'payment',
                    createTransaction: async (tokenData) => {
                        const created = await createTx({
                            method: 'credit_card',
                            token: tokenData.token,
                            installments: 1
                        });
                        state.txId = created.id;
                        state.subId = created.subscription_id || null;
                        return { id: created.id, status: created.status, next_action: created.next_action };
                    }
                });
                if (result.status === 'error') throw new Error(result.error || 'Cartão recusado');
                await waitPaid(state.subId || state.txId);
            } catch (err) {
                if (state.kind === 'one_shot') {
                    showErr(err.message + ' Tentando o checkout alternativo...');
                    try {
                        const r = await fetch('/api/pagou-checkout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                account_id: state.accountId,
                                email: state.email,
                                qty: state.qty,
                                amount: state.amount,
                                offer_name: state.offer,
                                kind: 'one_shot',
                                hosted: true
                            })
                        });
                        const data = await r.json();
                        if (r.ok && data.url) {
                            location.href = data.url;
                            return;
                        }
                        showErr(err.message);
                    } catch (_) {
                        showErr(err.message);
                    }
                } else {
                    showErr(err.message);
                }
                btn.disabled = false;
                btn.textContent = payLabel();
            }
        }

        function showPix(data) {
            state.txId = data.id;
            state.subId = data.subscription_id || null;
            state.pixCode = data.pix?.qr_code || '';
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('pixCard').style.display = 'block';
            document.getElementById('pixCopy').textContent = state.pixCode || (
                state.kind === 'subscription'
                    ? 'Abra o app do banco e autorize o PIX automático da Leona.'
                    : 'Código indisponível'
            );
            if (state.pixCode) {
                document.getElementById('pixQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(state.pixCode);
            } else {
                document.getElementById('pixQr').style.display = 'none';
                document.getElementById('pixWait').textContent = state.kind === 'subscription'
                    ? 'Aguardando autorização do PIX automático...'
                    : 'Aguardando pagamento...';
            }
            pollPaid();
        }

        function copyPix() {
            if (!state.pixCode) return;
            navigator.clipboard.writeText(state.pixCode).then(() => {
                document.getElementById('pixWait').textContent = 'Código copiado. Aguardando pagamento...';
            });
        }

        async function waitPaid(id) {
            for (let i = 0; i < 20; i++) {
                const paid = await checkPaid(id);
                if (paid) return showOk();
                await new Promise((r) => setTimeout(r, 2000));
            }
            document.getElementById('pixWait').textContent = 'Pagamento em análise. Você já pode voltar à assinatura.';
        }

        function pollPaid() {
            const timer = setInterval(async () => {
                if (await checkPaid(state.subId || state.txId)) {
                    clearInterval(timer);
                    showOk();
                }
            }, 3500);
        }

        async function checkPaid(id) {
            if (!id) return false;
            const q = new URLSearchParams({ id, account_id: state.accountId, email: state.email });
            if (state.subId && id === state.subId) q.set('type', 'subscription');
            const r = await fetch('/api/pagou-pay?' + q.toString());
            const data = await r.json();
            return !!(r.ok && data.paid);
        }

        function showOk() {
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('pixCard').style.display = 'none';
            document.getElementById('okCard').style.display = 'block';
        }
    </script>
</body>
</html>
