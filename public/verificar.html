<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar faturamento — Leona</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1c1c1c;
      --line: #2d2d2d;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --accent: #00d4aa;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
    }
    h1 { font-size: 1.35rem; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }
    form { display: flex; gap: 10px; }
    input {
      flex: 1;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #111;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: var(--accent);
      color: #04110d;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .result { margin-top: 22px; }
    .total {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .meta { color: var(--muted); margin-top: 6px; font-size: 0.92rem; }
    .accounts { margin-top: 16px; display: grid; gap: 8px; }
    .account {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .err { color: var(--error); margin-top: 16px; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Verificar faturamento</h1>
    <p>Busca o faturamento lifetime em reais no Leona pelo e-mail da conta.</p>
    <form id="form">
      <input id="email" type="email" placeholder="email@cliente.com" required autocomplete="email">
      <button type="submit" id="btn">Buscar</button>
    </form>
    <div id="out"></div>
  </main>
  <script>
    const form = document.getElementById('form');
    const emailEl = document.getElementById('email');
    const btn = document.getElementById('btn');
    const out = document.getElementById('out');

    const params = new URLSearchParams(location.search);
    if (params.get('email')) emailEl.value = params.get('email');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = emailEl.value.trim();
      if (!email) return;
      btn.disabled = true;
      out.innerHTML = '<p class="meta">Buscando...</p>';
      try {
        const res = await fetch('/api/verificar?email=' + encodeURIComponent(email));
        const data = await res.json();
        if (!res.ok || data.found === false) {
          out.innerHTML = '<p class="err">' + (data.error || 'Conta não encontrada') + '</p>';
          return;
        }
        const accounts = (data.accounts || []).map((row) => (
          '<div class="account"><div>Conta ' + row.account_id +
          '<div class="meta">' + [row.name, row.plan, row.status].filter(Boolean).join(' · ') +
          '</div></div><strong>' + row.revenue_formatted + '</strong></div>'
        )).join('');
        out.innerHTML =
          '<div class="result"><div class="total">' + data.total_formatted + '</div>' +
          '<div class="meta">' + data.email + (data.accounts.length > 1 ? ' · ' + data.accounts.length + ' contas' : '') + '</div>' +
          (data.accounts.length > 1 ? '<div class="accounts">' + accounts + '</div>' : '') +
          '</div>';
      } catch (error) {
        out.innerHTML = '<p class="err">Falha ao buscar</p>';
      } finally {
        btn.disabled = false;
      }
    });

    if (emailEl.value) form.requestSubmit();
  </script>
</body>
</html>
