<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs /assinatura | Leona Finance</title>
    <link rel="icon" type="image/svg+xml" href="/leona-finance-icon.svg">
    <style>
        :root {
            --bg-primary: #0c0a12;
            --bg-secondary: #151120;
            --bg-card: #1e1830;
            --accent: #8b5cf6;
            --accent-soft: rgba(139, 92, 246, 0.12);
            --green: #10b981;
            --orange: #f59e0b;
            --blue: #38bdf8;
            --text-primary: #f0ecf7;
            --text-secondary: #9589ad;
            --text-muted: #6b5f82;
            --error: #ef4444;
            --border: #2a2240;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
        }
        .login-card h1 { font-size: 1.2rem; margin-bottom: 8px; }
        .login-card p { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 16px; }
        .login-card input, .filters input, .filters select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .login-card button, .btn {
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .login-error { color: var(--error); font-size: 0.85rem; margin-top: 10px; display: none; }
        .container { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; display: none; }
        header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav a { color: var(--blue); text-decoration: none; font-size: 0.85rem; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .filters input, .filters select { width: auto; min-width: 180px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; font-size: 0.7rem; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
        .guru { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }
        .pagou { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
        .paddle { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
        .details { color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; max-width: 420px; }
        .muted { color: var(--text-muted); }
        .empty { color: var(--text-secondary); padding: 24px 0; }
    </style>
</head>
<body>
    <div class="login-wrap" id="loginWrap">
        <div class="login-card">
            <h1>Logs /assinatura</h1>
            <p>Acesso restrito. Use o mesmo token da área /guru.</p>
            <input id="tokenInput" type="password" placeholder="Token de suporte" autocomplete="off">
            <button id="loginBtn" style="margin-top:12px;width:100%;">Entrar</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <div class="container" id="app">
        <header>
            <div>
                <div class="nav"><a href="/guru">← Faturamento</a></div>
                <h1>Logs da /assinatura</h1>
                <p class="muted">Acesso, e-mail, ID da conta e o que o cliente fez na Guru ou Pagou. Retenção: 48 horas.</p>
            </div>
            <button class="btn" id="reloadBtn">Atualizar</button>
        </header>
        <div class="filters">
            <input id="emailFilter" placeholder="Filtrar e-mail">
            <input id="accountFilter" placeholder="Filtrar account_id">
            <select id="providerFilter">
                <option value="">Todos os provedores</option>
                <option value="guru">Guru</option>
                <option value="pagou">Pagou</option>
                <option value="paddle">Paddle</option>
            </select>
            <button class="btn" id="applyBtn">Filtrar</button>
        </div>
        <div id="tableWrap"><p class="empty">Carregando…</p></div>
    </div>

    <script>
        const TOKEN_KEY = 'leona_support_chat_token';
        let token = localStorage.getItem(TOKEN_KEY) || '';

        function showLogin(msg) {
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginWrap').style.display = 'flex';
            const err = document.getElementById('loginError');
            if (msg) { err.textContent = msg; err.style.display = 'block'; }
        }
        function showApp() {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        document.getElementById('loginBtn').onclick = () => {
            const value = document.getElementById('tokenInput').value.trim();
            if (!value) return showLogin('Cole o token primeiro.');
            token = value;
            localStorage.setItem(TOKEN_KEY, token);
            showApp();
            loadLogs();
        };
        document.getElementById('tokenInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
        document.getElementById('reloadBtn').onclick = loadLogs;
        document.getElementById('applyBtn').onclick = loadLogs;

        function fmt(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
        }
        function pill(provider) {
            const p = String(provider || 'guru');
            return `<span class="pill ${p}">${p}</span>`;
        }
        function details(obj) {
            if (!obj || Object.keys(obj).length === 0) return '<span class="muted">—</span>';
            return `<div class="details">${escapeHtml(JSON.stringify(obj, null, 2))}</div>`;
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function loadLogs() {
            const wrap = document.getElementById('tableWrap');
            wrap.innerHTML = '<p class="empty">Carregando…</p>';
            const qs = new URLSearchParams();
            const email = document.getElementById('emailFilter').value.trim();
            const account = document.getElementById('accountFilter').value.trim();
            const provider = document.getElementById('providerFilter').value;
            if (email) qs.set('email', email);
            if (account) qs.set('account_id', account);
            if (provider) qs.set('provider', provider);
            qs.set('limit', '250');
            const r = await fetch(`/api/assinatura-log?${qs}`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await r.json().catch(() => ({}));
            if (r.status === 401) {
                localStorage.removeItem(TOKEN_KEY);
                return showLogin('Token inválido.');
            }
            if (!r.ok) {
                wrap.innerHTML = `<p class="empty">${escapeHtml(data.error || 'Erro ao carregar')}</p>`;
                return;
            }
            const rows = data.logs || [];
            if (!rows.length) {
                wrap.innerHTML = '<p class="empty">Nenhum acesso ainda.</p>';
                return;
            }
            wrap.innerHTML = `<table>
                <thead>
                    <tr>
                        <th>Quando</th>
                        <th>Ação</th>
                        <th>Provedor</th>
                        <th>E-mail</th>
                        <th>Account ID</th>
                        <th>O que fez</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows.map((row) => `<tr>
                        <td>${fmt(row.created_at)}</td>
                        <td>${escapeHtml(row.action)}</td>
                        <td>${pill(row.provider)}</td>
                        <td>${escapeHtml(row.email || '—')}</td>
                        <td>${escapeHtml(row.account_id || '—')}</td>
                        <td>${details(row.details)}</td>
                        <td class="muted">${escapeHtml(row.ip || '—')}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
        }

        if (token) {
            showApp();
            loadLogs();
        }
    </script>
</body>
</html>
