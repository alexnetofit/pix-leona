<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha de Premiação — Leona</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Acompanhe seu faturamento e resgate premiações exclusivas Leona.">
  <style>
    :root {
      --bg: #07060b;
      --bg-soft: #110e18;
      --card: #161222;
      --card-hover: #1c172b;
      --border: rgba(255,255,255,0.08);
      --text: #f4f0fa;
      --muted: #9d93b0;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --gold: #fbbf24;
      --success: #34d399;
      --locked: #4b4560;
      --shadow: 0 24px 80px rgba(0,0,0,0.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(139,92,246,0.18), transparent 35%),
        radial-gradient(circle at 85% 10%, rgba(34,211,238,0.12), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(251,191,36,0.08), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 120px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img { height: 36px; width: auto; }

    .pill {
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255,255,255,0.03);
    }

    .hero {
      background: linear-gradient(135deg, rgba(139,92,246,0.14), rgba(34,211,238,0.06));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .hero-grid { grid-template-columns: 1fr; }
    }

    .eyebrow {
      color: var(--accent-2);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .sub {
      color: var(--muted);
      max-width: 48ch;
    }

    .revenue-card {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .revenue-label {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 6px;
    }

    .revenue-value {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(160deg, #fde68a 0%, #fbbf24 38%, #f59e0b 68%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .revenue-meta {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .progress-block {
      margin-top: 22px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      width: 0%;
      transition: width 0.6s ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; }
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .stat span { color: var(--muted); font-size: 0.85rem; }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .prizes {
      display: grid;
      gap: 16px;
    }

    .prize-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .trail-col {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .trail-line {
      position: absolute;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
    }

    .trail-line.up { top: 0; height: 50%; }
    .trail-line.down { top: 50%; bottom: 0; height: auto; }

    .prize-row:first-child .trail-line.up { display: none; }
    .prize-row:last-child .trail-line.down { display: none; }

    .prize-row.reached .trail-line.up {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52,211,153,0.35);
    }

    .prize-row.continue .trail-line.down {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52,211,153,0.35);
    }

    .checkpoint {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid rgba(255,255,255,0.22);
      z-index: 1;
      flex-shrink: 0;
    }

    .checkpoint.done {
      background: var(--success);
      border-color: #6ee7b7;
      box-shadow: 0 0 0 4px rgba(52,211,153,0.18), 0 0 14px rgba(52,211,153,0.55);
    }

    .prize {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 18px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .prize.available:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      box-shadow: 0 12px 40px rgba(139,92,246,0.15);
    }

    .prize.locked {
      opacity: 0.55;
      filter: grayscale(0.2);
    }

    @media (max-width: 720px) {
      .prize {
        grid-template-columns: 1fr;
      }
      .prize-row {
        grid-template-columns: 22px 1fr;
        gap: 10px;
      }
    }

    .milestone-badge {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.1;
      background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(139,92,246,0.25));
      border: 1px solid rgba(251,191,36,0.35);
      color: var(--gold);
    }

    .prize-thumb {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 16px;
      overflow: hidden;
      background: #0a0812;
      border: 1px solid rgba(139,92,246,0.25);
      flex-shrink: 0;
    }

    .prize-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .prize-thumb .milestone-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 6px;
      font-size: 0.65rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .prize.available .prize-thumb {
      border-color: rgba(139,92,246,0.45);
      box-shadow: 0 0 24px rgba(139,92,246,0.2);
    }

    .prize.locked .prize-thumb {
      filter: grayscale(0.6) brightness(0.7);
      border-color: var(--border);
    }

    .prize.locked .milestone-badge {
      background: rgba(255,255,255,0.04);
      border-color: var(--border);
      color: var(--locked);
    }

    .prize h3 {
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .prize ul {
      list-style: none;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .prize li::before {
      content: '•';
      color: var(--accent);
      margin-right: 8px;
    }

    .prize li.highlight {
      color: #d8b4fe;
      font-weight: 600;
    }

    .prize li.highlight::before {
      color: var(--gold);
    }

    .prize-actions {
      text-align: right;
      min-width: 180px;
    }

    .prize-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .prize-cta-row .btn {
      width: auto;
      flex: 1 1 140px;
      padding: 10px 12px;
      font-size: 0.8rem;
    }

    .btn-ghost {
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-anticipate {
      background: rgba(251,191,36,0.12);
      color: var(--gold);
      border: 1px solid rgba(251,191,36,0.35);
    }

    @media (max-width: 720px) {
      .prize-actions { text-align: left; min-width: 0; }
    }

    .price-tag {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .price-tag.gratis {
      color: var(--success);
      letter-spacing: 0.04em;
    }

    .ship-tag {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .ship-tag.free { color: var(--success); font-weight: 600; }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.88rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6d28d9);
      color: white;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .status-chip.available {
      background: rgba(52,211,153,0.15);
      color: var(--success);
    }

    .status-chip.locked {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }

    .status-chip.ineligible {
      background: rgba(251,191,36,0.12);
      color: var(--gold);
    }

    .status-chip.acquired {
      background: rgba(139,92,246,0.16);
      color: #c4b5fd;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 8px 0 20px;
    }

    .tab {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      color: var(--text);
      border-color: rgba(139,92,246,0.55);
      background: rgba(139,92,246,0.16);
    }

    .orders {
      display: grid;
      gap: 12px;
    }

    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .order-head strong { display: block; }
    .order-head span { color: var(--muted); font-size: 0.82rem; }
    .order-item-list {
      list-style: none;
      display: grid;
      gap: 6px;
      margin: 0 0 14px;
      padding: 0;
    }
    .order-item-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9rem;
    }
    .order-item-list em {
      color: var(--muted);
      font-style: normal;
      white-space: nowrap;
    }
    .order-meta {
      display: grid;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .order-meta-block span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .order-meta-block p {
      margin: 0;
      font-size: 0.88rem;
      white-space: pre-line;
      color: var(--text);
    }
    .order-meta-block a { color: var(--accent-2); }
    .link-btn {
      margin-top: 8px;
      border: 0;
      background: none;
      color: var(--accent-2);
      font: inherit;
      font-size: 0.85rem;
      padding: 0;
      cursor: pointer;
    }
    .address-form {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .address-form.open { display: grid; }
    .address-form label {
      display: grid;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .address-form .wide { grid-column: 1 / -1; }
    .address-form input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font: inherit;
    }
    .address-form .actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .address-form .btn {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .empty-orders { color: var(--muted); padding: 18px 4px; }

    .prize.ineligible {
      opacity: 0.82;
    }

    .eligibility-banner {
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.28);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 20px;
      display: grid;
      gap: 6px;
    }

    .eligibility-banner.ok {
      background: rgba(52,211,153,0.08);
      border-color: rgba(52,211,153,0.28);
    }

    .eligibility-banner strong {
      font-size: 0.95rem;
    }

    .eligibility-banner p {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .req-list {
      list-style: none;
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    .req-list li {
      color: var(--muted);
      font-size: 0.92rem;
      padding-left: 0;
    }

    .req-list li.ok {
      color: var(--text);
    }

    .req-list li::before {
      content: '○ ';
      color: var(--muted);
    }

    .req-list li.ok::before {
      content: '✓ ';
      color: var(--success);
    }

    .eligibility-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .loading, .error-box {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .error-box {
      color: #fca5a5;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius);
    }

    /* Checkout modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .overlay.open { display: flex; }

    .modal {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .checkout-summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 0.9rem;
    }

    .checkout-summary .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
    }

    .checkout-summary .row.total {
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 12px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .addr-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .addr-row .span-2 { grid-column: 1 / -1; }

    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
      appearance: none;
    }

    select:focus {
      outline: 2px solid rgba(139,92,246,0.45);
      border-color: rgba(139,92,246,0.6);
    }

    @media (max-width: 640px) {
      .addr-row { grid-template-columns: 1fr; }
      .addr-row .span-2 { grid-column: auto; }
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: 2px solid rgba(139,92,246,0.45);
      border-color: rgba(139,92,246,0.6);
    }

    .pay-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .pay-method {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      font: inherit;
    }

    .form-error {
      color: #fca5a5;
      font-size: 0.82rem;
    }

    .paid-banner {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(52,211,153,0.35);
      background: rgba(52,211,153,0.1);
      color: #bbf7d0;
      font-size: 0.92rem;
    }

    .pay-method.active {
      border-color: rgba(139,92,246,0.6);
      color: var(--text);
      background: rgba(139,92,246,0.12);
    }

    .note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 12px;
      text-align: center;
    }

    .page-bumps {
      margin: 8px 0 28px;
    }

    .order-bumps {
      margin-bottom: 18px;
    }

    .order-bumps-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .bump-item {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      transition: border-color 0.15s ease, background 0.15s ease;
      margin-bottom: 8px;
    }

    .bump-item.active {
      border-color: rgba(139,92,246,0.55);
      background: rgba(139,92,246,0.08);
    }

    .bump-item img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: #0a0812;
      border: 1px solid var(--border);
    }

    .bump-copy strong {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 2px;
    }

    .bump-copy span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .bump-price {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
    }

    .qty-bump {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .qty-bump-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .qty-copy {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .qty-copy strong {
      color: var(--gold);
      font-weight: 700;
    }

    .help-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
      vertical-align: middle;
    }

    .help-tip {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.28);
      background: transparent;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1;
      cursor: help;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    .help-tip:hover,
    .help-wrap.open .help-tip,
    .help-wrap:focus-within .help-tip {
      border-color: var(--gold);
      color: var(--gold);
    }

    .help-bubble {
      display: none;
      position: absolute;
      z-index: 30;
      width: 236px;
      bottom: calc(100% + 8px);
      right: -6px;
      padding: 10px 12px;
      background: #1a1526;
      border: 1px solid rgba(251,191,36,0.28);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.45;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      text-align: left;
      text-transform: none;
      letter-spacing: 0;
      white-space: normal;
    }

    .help-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 10px;
      border: 6px solid transparent;
      border-top-color: #1a1526;
    }

    .help-wrap.start .help-bubble {
      right: auto;
      left: -6px;
    }

    .help-wrap.start .help-bubble::after {
      right: auto;
      left: 10px;
    }

    .help-wrap:hover .help-bubble,
    .help-wrap.open .help-bubble,
    .help-wrap:focus-within .help-bubble {
      display: block;
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .qty-stepper button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
    }

    .qty-stepper button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .qty-stepper span {
      min-width: 18px;
      text-align: center;
      font-weight: 800;
    }

    .btn-cart {
      background: rgba(52,211,153,0.12);
      border: 1px solid rgba(52,211,153,0.4);
      color: #bbf7d0;
    }

    .cart-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-width: 720px;
      margin: 0 auto;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(139,92,246,0.4);
      background: rgba(17,14,24,0.94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .cart-bar[hidden] { display: none !important; }

    .cart-bar-copy {
      flex: 1;
      min-width: 0;
    }

    .cart-bar-copy strong {
      display: block;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-bar-copy span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .cart-bar .btn-primary {
      width: auto;
      flex-shrink: 0;
      min-width: 168px;
    }

    @media (max-width: 560px) {
      .cart-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .cart-bar .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img src="/logo-leona-branca.png" alt="Leona">
      </div>
      <div class="pill" id="accountPill">Conta —</div>
    </header>

    <div id="app">
      <div class="loading">Carregando sua trilha…</div>
    </div>
  </div>

  <div class="overlay" id="checkoutOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Pedido</div>
          <h2 id="checkoutTitle">Seu carrinho</h2>
        </div>
        <button class="close-btn" type="button" id="closeCheckout" aria-label="Fechar">×</button>
      </div>
      <div class="checkout-summary" id="checkoutSummary"></div>
      <div class="order-bumps" id="orderBumps"></div>
      <p class="form-error" id="checkoutError" hidden></p>
      <button class="btn btn-primary" type="button" id="checkoutSubmit">Pagar e resgatar</button>
      <p class="note">Um pedido só. Frete grátis. Endereço entra no checkout da Pagar.me.</p>
    </div>
  </div>

  <div class="overlay" id="anticipateOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="anticipateTitle">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Antecipação</div>
          <h2 id="anticipateTitle">Antecipar premiação</h2>
        </div>
        <button class="close-btn" type="button" id="closeAnticipate" aria-label="Fechar">×</button>
      </div>
      <p class="note" id="anticipateCopy"></p>
      <div class="prize-cta-row" style="margin-top:16px">
        <button class="btn btn-ghost" type="button" id="anticipateCancel">Cancelar</button>
        <button class="btn btn-primary" type="button" id="anticipateConfirm">Antecipar e adicionar</button>
      </div>
    </div>
  </div>

  <div class="cart-bar" id="cartBar" hidden>
    <div class="cart-bar-copy">
      <strong id="cartBarCount">0 prêmios</strong>
      <span id="cartBarTotal">Frete grátis</span>
    </div>
    <button class="btn btn-primary" type="button" id="cartBarCheckout">Finalizar pedido</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const accountId = params.get('id') || params.get('account_id') || '';
    const accountEmail = (params.get('email') || '').trim();
    const app = document.getElementById('app');
    const accountPill = document.getElementById('accountPill');
    const overlay = document.getElementById('checkoutOverlay');
    const anticipateOverlay = document.getElementById('anticipateOverlay');
    const anticipateCopy = document.getElementById('anticipateCopy');
    const checkoutTitle = document.getElementById('checkoutTitle');
    const checkoutError = document.getElementById('checkoutError');
    const checkoutSummary = document.getElementById('checkoutSummary');
    const orderBumpsEl = document.getElementById('orderBumps');
    const checkoutSubmit = document.getElementById('checkoutSubmit');
    const cartBar = document.getElementById('cartBar');
    const cartBarCount = document.getElementById('cartBarCount');
    const cartBarTotal = document.getElementById('cartBarTotal');
    const cartPrizeIds = new Set();
    const anticipatedPrizeIds = new Set();
    let pendingAnticipateId = null;
    let cartSeeded = false;
    let currentTab = 'prizes';
    let currentData = null;
    const extraQtyByPrize = {};
    let bumpQtyById = {};
    let checkoutBusy = false;

    const paidOk = params.get('paid') === '1';
    if (paidOk) currentTab = 'orders';
    function orderBumps() {
      return currentData?.order_bumps || [];
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    const EXTRA_PRICE_HINT = 'Unidades extras cobramos apenas o custo de produção — o Leona não obtém lucro na venda dos itens.';

    function extraPriceHintHtml(align = '') {
      return `<span class="help-wrap${align ? ` ${align}` : ''}">
        <button type="button" class="help-tip" aria-label="Por que esse preço?">?</button>
        <span class="help-bubble" role="tooltip">${esc(EXTRA_PRICE_HINT)}</span>
      </span>`;
    }

    function calcSegmentProgress(revenue, next) {
      if (!next) return 100;
      const prev = currentData?.prizes?.filter(p => p.milestone < next.milestone).pop();
      const from = prev ? prev.milestone : 0;
      const span = next.milestone - from;
      const done = revenue - from;
      return Math.max(0, Math.min(100, (done / span) * 100));
    }

    function seedCart(data) {
      if (cartSeeded) return;
      cartSeeded = true;
      for (const prize of data.prizes || []) {
        if (prize.status === 'available' && !prize.acquired) cartPrizeIds.add(prize.id);
      }
    }

    function cartPrizes() {
      return (currentData?.prizes || []).filter((prize) => cartPrizeIds.has(prize.id));
    }

    function previewCartTotalCents() {
      const selected = cartPrizes();
      if (!selected.length) return 0;
      let total = 0;
      for (const prize of selected) {
        if (prize.acquired) {
          total += Math.max(extraQty(prize.id), 1) * (prize.extraUnitCents || 0);
          continue;
        }
        if (anticipatedPrizeIds.has(prize.id)) {
          total += prize.extraUnitCents || 0;
        } else {
          total += prize.priceCents || 0;
        }
        total += extraUnitsCents(prize);
      }
      for (const bump of orderBumps()) {
        total += bumpQty(bump.id) * bump.priceCents;
      }
      return total;
    }

    function syncCartBar() {
      const selected = cartPrizes();
      const n = selected.length;
      if (!n) {
        cartBar.hidden = true;
        return;
      }
      cartBar.hidden = false;
      cartBarCount.textContent = n === 1 ? '1 prêmio no pedido' : `${n} prêmios no pedido`;
      cartBarTotal.textContent = `${formatBrl(previewCartTotalCents() / 100)} · Frete grátis`;
    }

    function render(data) {
      currentData = data;
      seedCart(data);
      accountPill.textContent = `Conta #${data.account_id}`;
      const name = data.user?.name || 'Parceiro Leona';
      const next = data.revenue.next_milestone;
      const progress = calcSegmentProgress(data.revenue.value, next);
      const eligibility = data.redeem_eligibility;
      const redeemableCount = data.prizes.filter(p => p.status === 'available').length;

      app.innerHTML = `
        ${paidOk ? `<div class="paid-banner">${(data.orders || []).some((order) => ['paid', 'fulfilled', 'fulfill_error'].includes(order.status))
          ? 'Pagamento confirmado. Seu pedido já foi pra fábrica. O rastreio aparece abaixo assim que a Hub enviar.'
          : 'Recebemos seu pagamento. Em instantes o pedido aparece nesta aba.'}</div>` : ''}
        <section class="hero">
          <div class="hero-grid">
            <div>
              <div class="eyebrow">Sua jornada</div>
              <h1>Olá, ${esc(name.split(' ')[0])}! 👋</h1>
              <p class="sub">Acompanhe seu faturamento e monte um pedido só com os prêmios desbloqueados. Frete grátis na hora de fechar.</p>
            </div>
            <div class="revenue-card">
              <div class="revenue-label">Faturamento acumulado</div>
              <div class="revenue-value">${esc(data.revenue.formatted)}</div>
              <div class="revenue-meta">
                ${data.revenue.source === 'mock' ? 'Valor de demonstração (conta demo).' : data.revenue.source === 'none' ? 'Ainda sem vendas em BRL nesta conta.' : 'Atualizado pela Leona.'}
              </div>
              ${next ? `
                <div class="progress-block">
                  <div class="progress-head">
                    <span>Próxima meta: ${esc(next.label)}</span>
                    <span>Faltam ${esc(formatBrl(next.remaining))}</span>
                  </div>
                  <div class="progress-track"><div class="progress-fill" style="width:${progress.toFixed(1)}%"></div></div>
                </div>
              ` : '<div class="revenue-meta" style="margin-top:14px;color:var(--success)">Você desbloqueou todos os marcos! 🎉</div>'}
            </div>
          </div>
        </section>

        ${eligibility ? `
          <div class="eligibility-banner ${eligibility.eligible && data.summary.unlocked > 0 ? 'ok' : ''}">
            <strong>${eligibility.eligible && data.summary.unlocked > 0 ? '✓ Requisito de resgate atendido' : 'Requisitos para resgate'}</strong>
            <ul class="req-list">
              <li class="${eligibility.eligible ? 'ok' : ''}">3 meses de Leona Flow</li>
              <li class="${data.summary.unlocked > 0 ? 'ok' : ''}">Faturamento atingido</li>
            </ul>
          </div>
        ` : ''}

        <div class="stats">
          <div class="stat"><strong>${redeemableCount}</strong><span>Prontos para resgatar</span></div>
          <div class="stat"><strong>${data.summary.unlocked}</strong><span>Marcos desbloqueados</span></div>
          <div class="stat"><strong>${esc(data.plan || '—')}</strong><span>Plano Leona</span></div>
        </div>

        <div class="tabs">
          <button class="tab ${currentTab === 'prizes' ? 'active' : ''}" type="button" data-tab="prizes">Premiações</button>
          <button class="tab ${currentTab === 'orders' ? 'active' : ''}" type="button" data-tab="orders">Pedidos e rastreio</button>
        </div>
        ${currentTab === 'orders' ? renderOrders(data.orders || []) : `
          <h2 class="section-title">Premiações</h2>
          <div class="prizes">
            ${data.prizes.map((prize, i) => renderPrize(prize, i, data.prizes)).join('')}
          </div>
        `}
      `;

      bindAddressForms();
      document.querySelectorAll('[data-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentTab = btn.dataset.tab;
          render(currentData);
        });
      });
      document.querySelectorAll('[data-cart]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.cart;
          const prize = (currentData?.prizes || []).find((item) => item.id === id);
          if (cartPrizeIds.has(id)) {
            cartPrizeIds.delete(id);
            extraQtyByPrize[id] = 0;
          } else {
            cartPrizeIds.add(id);
            if (prize?.acquired) extraQtyByPrize[id] = Math.max(extraQtyByPrize[id] || 0, 1);
          }
          render(currentData);
        });
      });
      document.querySelectorAll('[data-anticipate]').forEach((btn) => {
        btn.addEventListener('click', () => openAnticipate(btn.dataset.anticipate));
      });
      document.querySelectorAll('[data-qty]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.prize;
          const prize = (currentData?.prizes || []).find((item) => item.id === id);
          const delta = Number(btn.dataset.qty);
          extraQtyByPrize[id] = Math.max(0, (extraQtyByPrize[id] || 0) + delta);
          if (extraQtyByPrize[id] > 0) cartPrizeIds.add(id);
          else if (prize?.acquired) cartPrizeIds.delete(id);
          render(currentData);
        });
      });
      syncCartBar();
    }

    function formatOrderDate(value) {
      if (!value) return '—';
      return new Date(value).toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
    }

    function trackingHref(code) {
      return `https://www.linkcorreios.com.br/?id=${encodeURIComponent(code)}`;
    }

    function renderOrders(orders) {
      if (!orders.length) {
        return '<div class="empty-orders">Você ainda não tem pedidos nesta trilha.</div>';
      }
      return `<div class="orders">${orders.map((order) => {
        const items = (order.items || []).length
          ? `<ul class="order-item-list">${order.items.map((item) => `
              <li><span>${esc(item.title)}</span>${item.qty > 1 ? `<em>× ${item.qty}</em>` : ''}</li>
            `).join('')}</ul>`
          : '<div class="order-meta-block"><span>Itens</span><p>Pedido da trilha</p></div>';
        const codes = [...new Set(order.tracking_codes || [])];
        const tracking = codes.length
          ? codes.map((code) => `<a href="${esc(trackingHref(code))}" target="_blank" rel="noopener">${esc(code)}</a>`).join('<br>')
          : (order.status === 'pending' ? '' : 'Aguardando código da fábrica');
        const ship = order.shipping || {};
        const address = order.shipping?.formatted || order.address_editable
          ? `<div class="order-meta-block">
              <span>${order.factory_state === 'in_cart' ? 'Endereço de envio' : 'Enviado para'}</span>
              ${order.shipping?.formatted ? `<p>${esc(order.shipping.formatted)}</p>` : '<p>Ainda sem endereço.</p>'}
              ${order.address_editable ? `<button class="link-btn" type="button" data-edit-address="${esc(order.id)}">Alterar endereço</button>
                <form class="address-form" data-address-form="${esc(order.id)}">
                  <label>CEP<input name="cep" inputmode="numeric" maxlength="9" value="${esc(ship.cep || '')}"></label>
                  <label>UF<input name="state" maxlength="2" value="${esc(ship.state || '')}"></label>
                  <label class="wide">Rua<input name="street" value="${esc(ship.street || '')}"></label>
                  <label>Número<input name="number" value="${esc(ship.number || '')}"></label>
                  <label>Complemento<input name="complement" value="${esc(ship.complement || '')}"></label>
                  <label class="wide">Bairro<input name="neighborhood" value="${esc(ship.neighborhood || '')}"></label>
                  <label class="wide">Cidade<input name="city" value="${esc(ship.city || '')}"></label>
                  <div class="actions">
                    <button class="btn btn-primary" type="submit">Salvar endereço</button>
                    <button class="link-btn" type="button" data-cancel-address="${esc(order.id)}">Cancelar</button>
                  </div>
                  <p class="form-error" data-address-error hidden></p>
                </form>` : ''}
            </div>`
          : '';
        const trackBlock = tracking
          ? `<div class="order-meta-block"><span>Rastreio do pedido</span><p>${tracking}</p></div>`
          : '';
        const pay = order.checkout_url
          ? `<div class="order-meta-block"><a href="${esc(order.checkout_url)}" target="_blank" rel="noopener">Concluir pagamento</a></div>`
          : '';
        return `
          <article class="order-card">
            <div class="order-head">
              <div>
                <strong>${esc(order.status_label)}</strong>
                <span>${esc(formatOrderDate(order.paid_at || order.created_at))}</span>
              </div>
              <strong>${esc(order.amount_formatted)}</strong>
            </div>
            ${items}
            <div class="order-meta">
              ${address}
              ${trackBlock}
              ${pay}
            </div>
          </article>
        `;
      }).join('')}</div>`;
    }

    function extraQty(prizeId) {
      return extraQtyByPrize[prizeId] || 0;
    }

    function renderPrize(prize, index, prizes) {
      const cls = prize.status === 'available'
        ? 'available'
        : prize.status === 'ineligible'
          ? 'ineligible'
          : 'locked';
      const chip = prize.acquired ? 'acquired' : prize.status;
      const chipLabel = prize.acquired
        ? 'Já resgatado'
        : prize.status === 'available'
          ? 'Disponível'
          : prize.status === 'ineligible'
            ? 'Requisito pendente'
            : 'Bloqueado';
      const anticipated = anticipatedPrizeIds.has(prize.id);
      const canResgate = prize.status === 'available' || anticipated;
      const inCart = cartPrizeIds.has(prize.id);
      const reached = prize.unlocked;
      const continues = reached && prizes[index + 1]?.unlocked;
      const qty = extraQty(prize.id);
      const extraLabel = formatBrl((prize.extraUnitCents || 0) / 100);
      const showAnticipate = prize.can_anticipate && !anticipated;
      const priceLabel = anticipated
        ? formatBrl((prize.extraUnitCents || prize.priceCents || 0) / 100)
        : prize.priceFormatted;
      const cta = canResgate
        ? (inCart ? 'No carrinho' : prize.acquired ? 'Adicionar extra' : 'Adicionar')
        : prize.status === 'ineligible'
          ? '3 meses pagos necessários'
          : 'Meta não atingida';
      return `
        <div class="prize-row ${reached ? 'reached' : ''} ${continues ? 'continue' : ''}">
          <div class="trail-col">
            <span class="trail-line up"></span>
            <span class="checkpoint ${reached ? 'done' : ''}" aria-hidden="true"></span>
            <span class="trail-line down"></span>
          </div>
          <article class="prize ${cls}">
            <div class="prize-thumb">
              <img src="${esc(prize.image || '')}" alt="${esc(prize.title)}" loading="lazy">
              <div class="milestone-label">${esc(prize.label.replace('R$ ', ''))}</div>
            </div>
            <div>
              <span class="status-chip ${chip}">${chipLabel}</span>
              <h3>${esc(prize.title)}</h3>
              <ul>${prize.items.map((item) => {
                const text = typeof item === 'string' ? item : item.text;
                const highlight = typeof item === 'object' && item.highlight;
                return `<li class="${highlight ? 'highlight' : ''}">${esc(text)}</li>`;
              }).join('')}</ul>
            </div>
            <div class="prize-actions">
              <div class="price-tag">${esc(priceLabel)}</div>
              ${showAnticipate ? `
                <div class="prize-cta-row">
                  <button class="btn btn-ghost" type="button" disabled>3 meses pagos necessários</button>
                  <button class="btn btn-anticipate" type="button" data-anticipate="${esc(prize.id)}">Antecipar premiação</button>
                </div>
              ` : `
                <button class="btn ${inCart ? 'btn-cart' : 'btn-primary'}" data-cart="${esc(prize.id)}" ${canResgate ? '' : 'disabled'}>
                  ${cta}
                </button>
              `}
              <div class="qty-bump">
                <div class="qty-bump-label">Unidades extras</div>
                <div class="qty-row">
                  <div class="qty-copy">${prize.acquired ? 'Custo de produção' : 'Unidades extras'}<br><strong>${esc(extraLabel)}</strong> cada${extraPriceHintHtml()}</div>
                  <div class="qty-stepper">
                    <button type="button" data-qty="-1" data-prize="${esc(prize.id)}" ${qty <= 0 || !canResgate ? 'disabled' : ''}>−</button>
                    <span>${qty}</span>
                    <button type="button" data-qty="1" data-prize="${esc(prize.id)}" ${!canResgate ? 'disabled' : ''}>+</button>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
      `;
    }

    function formatBrl(value) {
      return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function bumpQty(id) {
      return bumpQtyById[id] || 0;
    }

    function extraUnitsCents(prize) {
      return extraQty(prize.id) * (prize.extraUnitCents || 0);
    }

    function calcCheckoutTotalCents() {
      return previewCartTotalCents();
    }

    function cartLinePriceLabel(prize) {
      if (prize.acquired) {
        const qty = Math.max(extraQty(prize.id), 1);
        return formatBrl((qty * (prize.extraUnitCents || 0)) / 100);
      }
      if (anticipatedPrizeIds.has(prize.id)) {
        return formatBrl((prize.extraUnitCents || 0) / 100);
      }
      return formatBrl((prize.priceCents || 0) / 100);
    }

    function updateCheckoutSummary() {
      const selected = cartPrizes();
      if (!selected.length) return;
      const prizeRows = selected.map((prize) => {
        const extras = extraQty(prize.id);
        const extraRow = !prize.acquired && extras > 0
          ? `<div class="row bump"><span>${esc(prize.title)} extra × ${extras}</span><span>+ ${esc(formatBrl(extraUnitsCents(prize) / 100))}</span></div>`
          : '';
        return `
          <div class="row"><span>${esc(prize.acquired ? `${prize.title} extra` : prize.title)}${prize.acquired && extras > 1 ? ` × ${extras}` : ''}</span><strong>${esc(cartLinePriceLabel(prize))}</strong></div>
          ${extraRow}
        `;
      }).join('');
      const bumpRows = orderBumps()
        .filter((b) => bumpQty(b.id) > 0)
        .map((b) => `<div class="row bump"><span>${esc(b.title)} × ${bumpQty(b.id)}</span><span>+ ${esc(formatBrl((bumpQty(b.id) * b.priceCents) / 100))}</span></div>`)
        .join('');
      checkoutSummary.innerHTML = `
        ${prizeRows}
        <div class="row"><span>Frete</span><span>Grátis</span></div>
        ${bumpRows}
        <div class="row total"><span>Total</span><span>${esc(formatBrl(calcCheckoutTotalCents() / 100))}</span></div>
      `;
    }

    function renderOrderBumps() {
      const selected = cartPrizes();
      if (!selected.length) return;
      orderBumpsEl.innerHTML = `
        <div class="order-bumps-title">Unidades extras</div>
        ${selected.map((prize) => {
          const qty = extraQty(prize.id);
          const extraLabel = formatBrl((prize.extraUnitCents || 0) / 100);
          return `
            <div class="bump-item">
              <img src="${esc(prize.image || '')}" alt="${esc(prize.title)}" loading="lazy">
              <div class="bump-copy">
                <strong>${esc(prize.title)}</strong>
                <span>Unidade extra · ${esc(extraLabel)} cada${extraPriceHintHtml('start')}</span>
              </div>
              <div class="qty-stepper">
                <button type="button" data-extra="${esc(prize.id)}" data-delta="-1" ${qty <= 0 ? 'disabled' : ''}>−</button>
                <span>${qty}</span>
                <button type="button" data-extra="${esc(prize.id)}" data-delta="1">+</button>
              </div>
            </div>
          `;
        }).join('')}
        <div class="order-bumps-title">Leve também</div>
        ${orderBumps().map((bump) => {
          const q = bumpQty(bump.id);
          return `
            <div class="bump-item ${q > 0 ? 'active' : ''}">
              <img src="${esc(bump.image)}" alt="${esc(bump.title)}" loading="lazy">
              <div class="bump-copy">
                <strong>${esc(bump.title)}</strong>
                <span>${esc(bump.subtitle)} · ${esc(formatBrl(bump.priceCents / 100))} cada</span>
              </div>
              <div class="qty-stepper">
                <button type="button" data-bump="${esc(bump.id)}" data-delta="-1" ${q <= 0 ? 'disabled' : ''}>−</button>
                <span>${q}</span>
                <button type="button" data-bump="${esc(bump.id)}" data-delta="1">+</button>
              </div>
            </div>
          `;
        }).join('')}
      `;

      orderBumpsEl.querySelectorAll('[data-extra]').forEach((btn) => {
        btn.addEventListener('click', () => {
          extraQtyByPrize[btn.dataset.extra] = Math.max(0, extraQty(btn.dataset.extra) + Number(btn.dataset.delta));
          renderOrderBumps();
          updateCheckoutSummary();
          syncCartBar();
        });
      });
      orderBumpsEl.querySelectorAll('[data-bump]').forEach((btn) => {
        btn.addEventListener('click', () => {
          bumpQtyById[btn.dataset.bump] = Math.max(0, bumpQty(btn.dataset.bump) + Number(btn.dataset.delta));
          renderOrderBumps();
          updateCheckoutSummary();
          syncCartBar();
        });
      });
    }

    function openCheckout() {
      if (!cartPrizes().length) return;
      bumpQtyById = bumpQtyById || {};
      checkoutBusy = false;
      checkoutError.hidden = true;
      checkoutSubmit.disabled = false;
      checkoutSubmit.textContent = 'Pagar e resgatar';
      checkoutTitle.textContent = 'Seu pedido';
      renderOrderBumps();
      updateCheckoutSummary();
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeCheckout() {
      if (checkoutBusy) return;
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
    }

    function closeAnticipate() {
      pendingAnticipateId = null;
      anticipateOverlay.classList.remove('open');
      anticipateOverlay.setAttribute('aria-hidden', 'true');
    }

    function openAnticipate(prizeId) {
      const prize = (currentData?.prizes || []).find((item) => item.id === prizeId);
      if (!prize?.can_anticipate) return;
      pendingAnticipateId = prizeId;
      const cost = formatBrl((prize.extraUnitCents || prize.anticipateCents || 0) / 100);
      anticipateCopy.innerHTML = `Antecipando, o <strong>${esc(prize.title)}</strong> sai pelo <strong>preço de custo</strong>, sem o desconto da trilha: <strong>${esc(cost)}</strong>.`;
      anticipateOverlay.classList.add('open');
      anticipateOverlay.setAttribute('aria-hidden', 'false');
    }

    function confirmAnticipate() {
      if (!pendingAnticipateId) return;
      anticipatedPrizeIds.add(pendingAnticipateId);
      cartPrizeIds.add(pendingAnticipateId);
      closeAnticipate();
      render(currentData);
    }

    document.getElementById('closeCheckout').addEventListener('click', closeCheckout);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCheckout(); });
    document.getElementById('closeAnticipate').addEventListener('click', closeAnticipate);
    document.getElementById('anticipateCancel').addEventListener('click', closeAnticipate);
    document.getElementById('anticipateConfirm').addEventListener('click', confirmAnticipate);
    anticipateOverlay.addEventListener('click', (e) => { if (e.target === anticipateOverlay) closeAnticipate(); });

    document.addEventListener('click', (e) => {
      const tip = e.target.closest('.help-tip');
      if (tip) {
        e.preventDefault();
        e.stopPropagation();
        const wrap = tip.closest('.help-wrap');
        const wasOpen = wrap.classList.contains('open');
        document.querySelectorAll('.help-wrap.open').forEach((w) => w.classList.remove('open'));
        if (!wasOpen) wrap.classList.add('open');
        return;
      }
      document.querySelectorAll('.help-wrap.open').forEach((w) => w.classList.remove('open'));
    });

    async function startCheckout() {
      const selected = cartPrizes();
      if (!selected.length || !currentData || checkoutBusy) return;

      const bumps = {};
      for (const bump of orderBumps()) {
        const q = bumpQty(bump.id);
        if (q) bumps[bump.id] = q;
      }
      const extras = {};
      for (const prize of selected) {
        const q = prize.acquired ? Math.max(extraQty(prize.id), 1) : extraQty(prize.id);
        if (q) extras[prize.id] = q;
      }

      checkoutBusy = true;
      checkoutError.hidden = true;
      checkoutSubmit.disabled = true;
      checkoutSubmit.textContent = 'Abrindo checkout…';

      try {
        const res = await fetch('/api/trilha-pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            account_id: currentData.account_id,
            email: accountEmail,
            prize_ids: selected.map((prize) => prize.id),
            extras,
            bumps,
            anticipated_ids: selected.map((prize) => prize.id).filter((id) => anticipatedPrizeIds.has(id))
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.url) throw new Error(data.error || `HTTP ${res.status}`);
        location.href = data.url;
      } catch (err) {
        checkoutBusy = false;
        checkoutSubmit.disabled = false;
        checkoutSubmit.textContent = 'Pagar e resgatar';
        checkoutError.textContent = err.message;
        checkoutError.hidden = false;
      }
    }

    function toggleAddressForm(orderId, open) {
      const form = document.querySelector(`[data-address-form="${orderId}"]`);
      if (form) form.classList.toggle('open', open);
    }

    async function fillAddressFromCep(form) {
      const cep = String(new FormData(form).get('cep') || '').replace(/\D/g, '');
      if (cep.length !== 8) return;
      try {
        const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await res.json();
        if (!res.ok || data.erro) return;
        if (data.logradouro) form.street.value = data.logradouro;
        if (data.bairro) form.neighborhood.value = data.bairro;
        if (data.localidade) form.city.value = data.localidade;
        if (data.uf) form.state.value = data.uf;
      } catch {
        /* ViaCEP fora não trava a edição */
      }
    }

    async function reloadTrilha() {
      const qs = new URLSearchParams({ id: accountId, email: accountEmail });
      const res = await fetch(`/api/trilha?${qs}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      currentTab = 'orders';
      render(data);
    }

    function bindAddressForms() {
      document.querySelectorAll('[data-edit-address]').forEach((btn) => {
        btn.addEventListener('click', () => toggleAddressForm(btn.dataset.editAddress, true));
      });
      document.querySelectorAll('[data-cancel-address]').forEach((btn) => {
        btn.addEventListener('click', () => toggleAddressForm(btn.dataset.cancelAddress, false));
      });
      document.querySelectorAll('[data-address-form]').forEach((form) => {
        form.cep?.addEventListener('blur', () => fillAddressFromCep(form));
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const errorEl = form.querySelector('[data-address-error]');
          const submit = form.querySelector('[type="submit"]');
          const payload = Object.fromEntries(new FormData(form).entries());
          if (errorEl) {
            errorEl.hidden = true;
            errorEl.textContent = '';
          }
          submit.disabled = true;
          submit.textContent = 'Salvando…';
          try {
            const res = await fetch('/api/trilha-address', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                account_id: currentData.account_id,
                email: accountEmail,
                order_id: form.dataset.addressForm,
                ...payload
              })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            await reloadTrilha();
          } catch (err) {
            if (errorEl) {
              errorEl.textContent = err.message;
              errorEl.hidden = false;
            }
            submit.disabled = false;
            submit.textContent = 'Salvar endereço';
          }
        });
      });
    }

    checkoutSubmit.addEventListener('click', startCheckout);
    document.getElementById('cartBarCheckout')?.addEventListener('click', openCheckout);

    async function boot() {
      if (!accountId || !accountEmail) {
        app.innerHTML = '<div class="error-box">Informe ID e e-mail na URL: <code>/trilha?id=1234&amp;email=teste123@gmail.com</code></div>';
        accountPill.textContent = 'Acesso incompleto';
        return;
      }

      try {
        const qs = new URLSearchParams({
          id: accountId,
          email: accountEmail
        });
        const res = await fetch(`/api/trilha?${qs.toString()}`);
        const data = await res.json();
        if (!res.ok) {
          const msg = data.code === 'EMAIL_ID_MISMATCH'
            ? 'ID da conta e e-mail não correspondem. Verifique o link enviado pela Leona.'
            : (data.error || data.message || `HTTP ${res.status}`);
          throw new Error(msg);
        }
        render(data);
      } catch (err) {
        app.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
        accountPill.textContent = 'Acesso negado';
      }
    }

    boot();
  </script>
</body>
</html>
