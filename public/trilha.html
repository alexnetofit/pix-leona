<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha de Premiação — Leona</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Acompanhe seu faturamento e resgate premiações exclusivas Leona.">
  <style>
    :root {
      --bg: #07060b;
      --bg-soft: #110e18;
      --card: #161222;
      --card-hover: #1c172b;
      --border: rgba(255,255,255,0.08);
      --text: #f4f0fa;
      --muted: #9d93b0;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --gold: #fbbf24;
      --success: #34d399;
      --locked: #4b4560;
      --shadow: 0 24px 80px rgba(0,0,0,0.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(139,92,246,0.18), transparent 35%),
        radial-gradient(circle at 85% 10%, rgba(34,211,238,0.12), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(251,191,36,0.08), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img { height: 36px; width: auto; }

    .pill {
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255,255,255,0.03);
    }

    .hero {
      background: linear-gradient(135deg, rgba(139,92,246,0.14), rgba(34,211,238,0.06));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .hero-grid { grid-template-columns: 1fr; }
    }

    .eyebrow {
      color: var(--accent-2);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .sub {
      color: var(--muted);
      max-width: 48ch;
    }

    .revenue-card {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .revenue-label {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 6px;
    }

    .revenue-value {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(160deg, #fde68a 0%, #fbbf24 38%, #f59e0b 68%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .revenue-meta {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .progress-block {
      margin-top: 22px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      width: 0%;
      transition: width 0.6s ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; }
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .stat span { color: var(--muted); font-size: 0.85rem; }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .prizes {
      display: grid;
      gap: 16px;
    }

    .prize-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .trail-col {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .trail-line {
      position: absolute;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
    }

    .trail-line.up { top: 0; height: 50%; }
    .trail-line.down { top: 50%; bottom: 0; height: auto; }

    .prize-row:first-child .trail-line.up { display: none; }
    .prize-row:last-child .trail-line.down { display: none; }

    .prize-row.reached .trail-line.up {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52,211,153,0.35);
    }

    .prize-row.continue .trail-line.down {
      background: var(--success);
      box-shadow: 0 0 8px rgba(52,211,153,0.35);
    }

    .checkpoint {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid rgba(255,255,255,0.22);
      z-index: 1;
      flex-shrink: 0;
    }

    .checkpoint.done {
      background: var(--success);
      border-color: #6ee7b7;
      box-shadow: 0 0 0 4px rgba(52,211,153,0.18), 0 0 14px rgba(52,211,153,0.55);
    }

    .prize {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 18px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .prize.available:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      box-shadow: 0 12px 40px rgba(139,92,246,0.15);
    }

    .prize.locked {
      opacity: 0.55;
      filter: grayscale(0.2);
    }

    @media (max-width: 720px) {
      .prize {
        grid-template-columns: 1fr;
      }
      .prize-row {
        grid-template-columns: 22px 1fr;
        gap: 10px;
      }
    }

    .milestone-badge {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.1;
      background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(139,92,246,0.25));
      border: 1px solid rgba(251,191,36,0.35);
      color: var(--gold);
    }

    .prize-thumb {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 16px;
      overflow: hidden;
      background: #0a0812;
      border: 1px solid rgba(139,92,246,0.25);
      flex-shrink: 0;
    }

    .prize-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .prize-thumb .milestone-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 6px;
      font-size: 0.65rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .prize.available .prize-thumb {
      border-color: rgba(139,92,246,0.45);
      box-shadow: 0 0 24px rgba(139,92,246,0.2);
    }

    .prize.locked .prize-thumb {
      filter: grayscale(0.6) brightness(0.7);
      border-color: var(--border);
    }

    .prize.locked .milestone-badge {
      background: rgba(255,255,255,0.04);
      border-color: var(--border);
      color: var(--locked);
    }

    .prize h3 {
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .prize ul {
      list-style: none;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .prize li::before {
      content: '•';
      color: var(--accent);
      margin-right: 8px;
    }

    .prize li.highlight {
      color: #d8b4fe;
      font-weight: 600;
    }

    .prize li.highlight::before {
      color: var(--gold);
    }

    .prize-actions {
      text-align: right;
      min-width: 180px;
    }

    @media (max-width: 720px) {
      .prize-actions { text-align: left; min-width: 0; }
    }

    .price-tag {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .price-tag.gratis {
      color: var(--success);
      letter-spacing: 0.04em;
    }

    .ship-tag {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .ship-tag.free { color: var(--success); font-weight: 600; }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.88rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6d28d9);
      color: white;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .status-chip.available {
      background: rgba(52,211,153,0.15);
      color: var(--success);
    }

    .status-chip.locked {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }

    .status-chip.ineligible {
      background: rgba(251,191,36,0.12);
      color: var(--gold);
    }

    .prize.ineligible {
      opacity: 0.82;
    }

    .eligibility-banner {
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.28);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 20px;
      display: grid;
      gap: 6px;
    }

    .eligibility-banner.ok {
      background: rgba(52,211,153,0.08);
      border-color: rgba(52,211,153,0.28);
    }

    .eligibility-banner strong {
      font-size: 0.95rem;
    }

    .eligibility-banner p {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .req-list {
      list-style: none;
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    .req-list li {
      color: var(--muted);
      font-size: 0.92rem;
      padding-left: 0;
    }

    .req-list li.ok {
      color: var(--text);
    }

    .req-list li::before {
      content: '○ ';
      color: var(--muted);
    }

    .req-list li.ok::before {
      content: '✓ ';
      color: var(--success);
    }

    .eligibility-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .loading, .error-box {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .error-box {
      color: #fca5a5;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius);
    }

    /* Checkout modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .overlay.open { display: flex; }

    .modal {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .checkout-summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 0.9rem;
    }

    .checkout-summary .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
    }

    .checkout-summary .row.total {
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 12px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .addr-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .addr-row .span-2 { grid-column: 1 / -1; }

    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
      appearance: none;
    }

    select:focus {
      outline: 2px solid rgba(139,92,246,0.45);
      border-color: rgba(139,92,246,0.6);
    }

    @media (max-width: 640px) {
      .addr-row { grid-template-columns: 1fr; }
      .addr-row .span-2 { grid-column: auto; }
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: 2px solid rgba(139,92,246,0.45);
      border-color: rgba(139,92,246,0.6);
    }

    .pay-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .pay-method {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      font: inherit;
    }

    .form-error {
      color: #fca5a5;
      font-size: 0.82rem;
    }

    .paid-banner {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(52,211,153,0.35);
      background: rgba(52,211,153,0.1);
      color: #bbf7d0;
      font-size: 0.92rem;
    }

    .pay-method.active {
      border-color: rgba(139,92,246,0.6);
      color: var(--text);
      background: rgba(139,92,246,0.12);
    }

    .note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 12px;
      text-align: center;
    }

    .page-bumps {
      margin: 8px 0 28px;
    }

    .order-bumps {
      margin-bottom: 18px;
    }

    .order-bumps-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .bump-item {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      transition: border-color 0.15s ease, background 0.15s ease;
      margin-bottom: 8px;
    }

    .bump-item.active {
      border-color: rgba(139,92,246,0.55);
      background: rgba(139,92,246,0.08);
    }

    .bump-item img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: #0a0812;
      border: 1px solid var(--border);
    }

    .bump-copy strong {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 2px;
    }

    .bump-copy span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .bump-price {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
    }

    .qty-bump {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .qty-bump-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .qty-copy {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .qty-copy strong {
      color: var(--gold);
      font-weight: 700;
    }

    .help-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
      vertical-align: middle;
    }

    .help-tip {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.28);
      background: transparent;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1;
      cursor: help;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    .help-tip:hover,
    .help-wrap.open .help-tip,
    .help-wrap:focus-within .help-tip {
      border-color: var(--gold);
      color: var(--gold);
    }

    .help-bubble {
      display: none;
      position: absolute;
      z-index: 30;
      width: 236px;
      bottom: calc(100% + 8px);
      right: -6px;
      padding: 10px 12px;
      background: #1a1526;
      border: 1px solid rgba(251,191,36,0.28);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.45;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      text-align: left;
      text-transform: none;
      letter-spacing: 0;
      white-space: normal;
    }

    .help-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 10px;
      border: 6px solid transparent;
      border-top-color: #1a1526;
    }

    .help-wrap.start .help-bubble {
      right: auto;
      left: -6px;
    }

    .help-wrap.start .help-bubble::after {
      right: auto;
      left: 10px;
    }

    .help-wrap:hover .help-bubble,
    .help-wrap.open .help-bubble,
    .help-wrap:focus-within .help-bubble {
      display: block;
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .qty-stepper button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
    }

    .qty-stepper button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .qty-stepper span {
      min-width: 18px;
      text-align: center;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img src="/logo-leona-branca.png" alt="Leona">
      </div>
      <div class="pill" id="accountPill">Conta —</div>
    </header>

    <div id="app">
      <div class="loading">Carregando sua trilha…</div>
    </div>
  </div>

  <div class="overlay" id="checkoutOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Pagamento</div>
          <h2 id="checkoutTitle">Abrindo checkout…</h2>
        </div>
        <button class="close-btn" type="button" id="closeCheckout" aria-label="Fechar">×</button>
      </div>
      <p class="note" id="checkoutStatus">A Pagar.me pede seus dados e o endereço de envio.</p>
      <p class="form-error" id="checkoutError" hidden></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const accountId = params.get('id') || params.get('account_id') || '';
    const accountEmail = (params.get('email') || '').trim();
    const app = document.getElementById('app');
    const accountPill = document.getElementById('accountPill');
    const overlay = document.getElementById('checkoutOverlay');
    const checkoutTitle = document.getElementById('checkoutTitle');
    const checkoutError = document.getElementById('checkoutError');
    let currentData = null;
    const extraQtyByPrize = {};
    let bumpQtyById = {};
    let checkoutBusy = false;

    const paidOk = params.get('paid') === '1';
    function orderBumps() {
      return currentData?.order_bumps || [];
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    const EXTRA_PRICE_HINT = 'Unidades extras cobramos apenas o custo de produção — o Leona não obtém lucro na venda dos itens.';

    function extraPriceHintHtml(align = '') {
      return `<span class="help-wrap${align ? ` ${align}` : ''}">
        <button type="button" class="help-tip" aria-label="Por que esse preço?">?</button>
        <span class="help-bubble" role="tooltip">${esc(EXTRA_PRICE_HINT)}</span>
      </span>`;
    }

    function calcSegmentProgress(revenue, next) {
      if (!next) return 100;
      const prev = currentData?.prizes?.filter(p => p.milestone < next.milestone).pop();
      const from = prev ? prev.milestone : 0;
      const span = next.milestone - from;
      const done = revenue - from;
      return Math.max(0, Math.min(100, (done / span) * 100));
    }

    function render(data) {
      currentData = data;
      accountPill.textContent = `Conta #${data.account_id}`;
      const name = data.user?.name || 'Parceiro Leona';
      const next = data.revenue.next_milestone;
      const progress = calcSegmentProgress(data.revenue.value, next);
      const eligibility = data.redeem_eligibility;
      const redeemableCount = data.prizes.filter(p => p.status === 'available').length;

      app.innerHTML = `
        ${paidOk ? '<div class="paid-banner">Pagamento iniciado. Assim que a Pagar.me confirmar, a gente separa o envio do prêmio.</div>' : ''}
        <section class="hero">
          <div class="hero-grid">
            <div>
              <div class="eyebrow">Sua jornada</div>
              <h1>Olá, ${esc(name.split(' ')[0])}! 👋</h1>
              <p class="sub">Acompanhe seu faturamento acumulado e resgate os prêmios físicos desbloqueados em cada marco da trilha.</p>
            </div>
            <div class="revenue-card">
              <div class="revenue-label">Faturamento acumulado</div>
              <div class="revenue-value">${esc(data.revenue.formatted)}</div>
              <div class="revenue-meta">
                ${data.revenue.source === 'mock' ? 'Valor de demonstração (conta demo).' : data.revenue.source === 'none' ? 'Ainda sem vendas em BRL nesta conta.' : 'Atualizado pela Leona.'}
              </div>
              ${next ? `
                <div class="progress-block">
                  <div class="progress-head">
                    <span>Próxima meta: ${esc(next.label)}</span>
                    <span>Faltam ${esc(formatBrl(next.remaining))}</span>
                  </div>
                  <div class="progress-track"><div class="progress-fill" style="width:${progress.toFixed(1)}%"></div></div>
                </div>
              ` : '<div class="revenue-meta" style="margin-top:14px;color:var(--success)">Você desbloqueou todos os marcos! 🎉</div>'}
            </div>
          </div>
        </section>

        ${eligibility ? `
          <div class="eligibility-banner ${eligibility.eligible && data.summary.unlocked > 0 ? 'ok' : ''}">
            <strong>${eligibility.eligible && data.summary.unlocked > 0 ? '✓ Requisito de resgate atendido' : 'Requisitos para resgate'}</strong>
            <ul class="req-list">
              <li class="${eligibility.eligible ? 'ok' : ''}">3 meses de Leona Flow</li>
              <li class="${data.summary.unlocked > 0 ? 'ok' : ''}">Faturamento atingido</li>
            </ul>
          </div>
        ` : ''}

        <div class="stats">
          <div class="stat"><strong>${redeemableCount}</strong><span>Prontos para resgatar</span></div>
          <div class="stat"><strong>${data.summary.unlocked}</strong><span>Marcos desbloqueados</span></div>
          <div class="stat"><strong>${esc(data.plan || '—')}</strong><span>Plano Leona</span></div>
        </div>

        ${renderPageBumps()}
        <h2 class="section-title">Premiações</h2>
        <div class="prizes">
          ${data.prizes.map((prize, i) => renderPrize(prize, i, data.prizes)).join('')}
        </div>
      `;

      document.querySelectorAll('[data-resgate]').forEach((btn) => {
        btn.addEventListener('click', () => startCheckout(btn.dataset.resgate));
      });
      document.querySelectorAll('[data-qty]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.prize;
          const delta = Number(btn.dataset.qty);
          extraQtyByPrize[id] = Math.max(0, (extraQtyByPrize[id] || 0) + delta);
          render(currentData);
        });
      });
      document.querySelectorAll('[data-bump]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.bump;
          const delta = Number(btn.dataset.delta);
          bumpQtyById[id] = Math.max(0, bumpQty(id) + delta);
          render(currentData);
        });
      });
    }

    function extraQty(prizeId) {
      return extraQtyByPrize[prizeId] || 0;
    }

    function renderPrize(prize, index, prizes) {
      const cls = prize.status === 'available'
        ? 'available'
        : prize.status === 'ineligible'
          ? 'ineligible'
          : 'locked';
      const chip = prize.status;
      const chipLabel = prize.status === 'available'
        ? 'Disponível'
        : prize.status === 'ineligible'
          ? 'Requisito pendente'
          : 'Bloqueado';
      const canResgate = prize.status === 'available';
      const reached = prize.unlocked;
      const continues = reached && prizes[index + 1]?.unlocked;
      const qty = extraQty(prize.id);
      const extraLabel = formatBrl((prize.extraUnitCents || 0) / 100);
      return `
        <div class="prize-row ${reached ? 'reached' : ''} ${continues ? 'continue' : ''}">
          <div class="trail-col">
            <span class="trail-line up"></span>
            <span class="checkpoint ${reached ? 'done' : ''}" aria-hidden="true"></span>
            <span class="trail-line down"></span>
          </div>
          <article class="prize ${cls}">
            <div class="prize-thumb">
              <img src="${esc(prize.image || '')}" alt="${esc(prize.title)}" loading="lazy">
              <div class="milestone-label">${esc(prize.label.replace('R$ ', ''))}</div>
            </div>
            <div>
              <span class="status-chip ${chip}">${chipLabel}</span>
              <h3>${esc(prize.title)}</h3>
              <ul>${prize.items.map((item) => {
                const text = typeof item === 'string' ? item : item.text;
                const highlight = typeof item === 'object' && item.highlight;
                return `<li class="${highlight ? 'highlight' : ''}">${esc(text)}</li>`;
              }).join('')}</ul>
            </div>
            <div class="prize-actions">
              <div class="price-tag ${prize.prizeFree ? 'gratis' : ''}">${esc(prize.priceFormatted)}</div>
              <div class="ship-tag ${prize.freeShipping ? 'free' : ''}">${esc(prize.shippingLabel)}</div>
              <button class="btn btn-primary" data-resgate="${esc(prize.id)}" ${canResgate ? '' : 'disabled'}>
                ${canResgate ? esc(prize.cta || 'Resgatar') : prize.status === 'ineligible' ? '3 meses pagos necessários' : 'Meta não atingida'}
              </button>
              <div class="qty-bump">
                <div class="qty-bump-label">Order bump</div>
                <div class="qty-row">
                  <div class="qty-copy">Unidades extras<br><strong>${esc(extraLabel)}</strong> cada${extraPriceHintHtml()}</div>
                  <div class="qty-stepper">
                    <button type="button" data-qty="-1" data-prize="${esc(prize.id)}" ${qty <= 0 || !canResgate ? 'disabled' : ''}>−</button>
                    <span>${qty}</span>
                    <button type="button" data-qty="1" data-prize="${esc(prize.id)}" ${!canResgate ? 'disabled' : ''}>+</button>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
      `;
    }

    function formatBrl(value) {
      return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function bumpQty(id) {
      return bumpQtyById[id] || 0;
    }

    function renderPageBumps() {
      const bumps = orderBumps();
      if (!bumps.length) return '';
      return `
        <section class="order-bumps page-bumps">
          <div class="order-bumps-title">Leve também</div>
          ${bumps.map((bump) => {
            const q = bumpQty(bump.id);
            return `
              <div class="bump-item ${q > 0 ? 'active' : ''}">
                <img src="${esc(bump.image)}" alt="${esc(bump.title)}" loading="lazy">
                <div class="bump-copy">
                  <strong>${esc(bump.title)}</strong>
                  <span>${esc(bump.subtitle)} · ${esc(formatBrl(bump.priceCents / 100))} cada</span>
                </div>
                <div class="qty-stepper">
                  <button type="button" data-bump="${esc(bump.id)}" data-delta="-1" ${q <= 0 ? 'disabled' : ''}>−</button>
                  <span>${q}</span>
                  <button type="button" data-bump="${esc(bump.id)}" data-delta="1">+</button>
                </div>
              </div>
            `;
          }).join('')}
        </section>
      `;
    }

    function closeCheckout() {
      if (checkoutBusy) return;
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('closeCheckout').addEventListener('click', closeCheckout);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCheckout(); });

    document.addEventListener('click', (e) => {
      const tip = e.target.closest('.help-tip');
      if (tip) {
        e.preventDefault();
        e.stopPropagation();
        const wrap = tip.closest('.help-wrap');
        const wasOpen = wrap.classList.contains('open');
        document.querySelectorAll('.help-wrap.open').forEach((w) => w.classList.remove('open'));
        if (!wasOpen) wrap.classList.add('open');
        return;
      }
      document.querySelectorAll('.help-wrap.open').forEach((w) => w.classList.remove('open'));
    });

    async function startCheckout(prizeId) {
      const prize = currentData?.prizes?.find((row) => row.id === prizeId);
      if (!prize || prize.status !== 'available' || checkoutBusy) return;

      const bumps = {};
      for (const bump of orderBumps()) {
        const q = bumpQty(bump.id);
        if (q) bumps[bump.id] = q;
      }

      checkoutBusy = true;
      checkoutError.hidden = true;
      checkoutTitle.textContent = 'Abrindo checkout…';
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');

      try {
        const res = await fetch('/api/trilha-pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            account_id: currentData.account_id,
            email: accountEmail,
            prize_id: prize.id,
            extra_qty: extraQty(prize.id),
            bumps
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.url) throw new Error(data.error || `HTTP ${res.status}`);
        location.href = data.url;
      } catch (err) {
        checkoutBusy = false;
        checkoutTitle.textContent = 'Não deu pra abrir o pagamento';
        checkoutError.textContent = err.message;
        checkoutError.hidden = false;
      }
    }

    async function boot() {
      if (!accountId || !accountEmail) {
        app.innerHTML = '<div class="error-box">Informe ID e e-mail na URL: <code>/trilha?id=1234&amp;email=teste123@gmail.com</code></div>';
        accountPill.textContent = 'Acesso incompleto';
        return;
      }

      try {
        const qs = new URLSearchParams({
          id: accountId,
          email: accountEmail
        });
        const res = await fetch(`/api/trilha?${qs.toString()}`);
        const data = await res.json();
        if (!res.ok) {
          const msg = data.code === 'EMAIL_ID_MISMATCH'
            ? 'ID da conta e e-mail não correspondem. Verifique o link enviado pela Leona.'
            : (data.error || data.message || `HTTP ${res.status}`);
          throw new Error(msg);
        }
        render(data);
      } catch (err) {
        app.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
        accountPill.textContent = 'Acesso negado';
      }
    }

    boot();
  </script>
</body>
</html>
